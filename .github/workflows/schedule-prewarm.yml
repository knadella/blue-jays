# Daily: pre-warm /api/today, /api/players, /api/standings for every team in
# the picker so the first user load is fast.
#
# /api/players triggers per-game WPA tallies for any new completed game and
# caches them at /data/game_wpa/<abbrev>/<game_pk>.json on the Fly volume.
# After this job runs, subsequent requests are sub-second.
#
# Secrets: API_BASE_URL (required).
# Test: Actions → this workflow → Run workflow.
name: Schedule — prewarm caches

on:
  schedule:
    # 12:00 UTC daily (~7-8 AM ET) — after the latest possible game finishes.
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve API URL
        env:
          BASE: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ]; then
            echo "::error::Secret API_BASE_URL is not set."
            exit 1
          fi
          BASE="${BASE%/}"
          echo "API_URL=${BASE}" >> "$GITHUB_ENV"
          echo "✓ API_URL = ${BASE}"

      - name: Warm caches for each team
        run: |
          set -uo pipefail
          SEASON=$(date -u +%Y)
          # Teams offered in the picker (mirror config.SELECTABLE_TEAMS).
          TEAMS="TOR NYY"
          fail=0
          for TEAM in $TEAMS; do
            echo "=== ${TEAM} ==="

            echo "→ GET /api/today?team=${TEAM}"
            CODE=$(curl -s -o /tmp/today.json -w "%{http_code}" --max-time 60 \
              "${API_URL}/api/today?team=${TEAM}")
            echo "  HTTP ${CODE}"
            [ "$CODE" -ge 400 ] && echo "::warning::/api/today (${TEAM}) HTTP ${CODE}"

            echo "→ GET /api/players?season=${SEASON}&team=${TEAM}"
            CODE=$(curl -s -o /tmp/players.json -w "%{http_code}" --max-time 240 \
              "${API_URL}/api/players?season=${SEASON}&team=${TEAM}")
            echo "  HTTP ${CODE}"
            if [ "$CODE" -ge 400 ]; then
              echo "::error::/api/players (${TEAM}) HTTP ${CODE}"
              head -20 /tmp/players.json || true
              fail=1
            else
              python3 -c "import json; d=json.load(open('/tmp/players.json')); print(f\"  ✓ {d['games_included']} games · {len(d['batters'])} batters · {len(d['pitchers'])} pitchers · last {d.get('last_game_date')}\")"
            fi

            echo "→ GET /api/standings?season=${SEASON}&team=${TEAM}"
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              "${API_URL}/api/standings?season=${SEASON}&team=${TEAM}")
            echo "  HTTP ${CODE}"
            [ "$CODE" -ge 400 ] && echo "::warning::/api/standings (${TEAM}) HTTP ${CODE}"
          done
          exit $fail
