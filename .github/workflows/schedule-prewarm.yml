# Daily: pre-warm /api/today + /api/players so first user load is fast.
#
# /api/players triggers per-game WPA tallies for any new completed game and
# caches them at /data/game_wpa/<game_pk>.json on the Fly volume. After this
# job runs, subsequent /api/players requests are sub-second.
#
# Secrets: API_BASE_URL (required).
# Test: Actions → this workflow → Run workflow.
name: Schedule — prewarm caches

on:
  schedule:
    # 12:00 UTC daily (~7-8 AM ET) — after the latest possible game finishes.
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve API URL
        env:
          BASE: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ]; then
            echo "::error::Secret API_BASE_URL is not set."
            exit 1
          fi
          BASE="${BASE%/}"
          echo "API_URL=${BASE}" >> "$GITHUB_ENV"
          echo "✓ API_URL = ${BASE}"

      - name: Warm /api/today
        run: |
          set -euo pipefail
          echo "→ GET /api/today"
          HTTP_CODE=$(curl -s -o /tmp/today.json -w "%{http_code}" \
            --max-time 60 \
            "${API_URL}/api/today")
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::/api/today returned HTTP ${HTTP_CODE}"
            cat /tmp/today.json | head -20 || true
          else
            python3 -c "import json; d=json.load(open('/tmp/today.json')); h=d['header']; print(f\"✓ {h['game_date']} {h['away_abbr']} {h['away_score']} @ {h['home_abbr']} {h['home_score']}\")"
          fi

      - name: Warm /api/players (season cache)
        run: |
          set -euo pipefail
          SEASON=$(date -u +%Y)
          echo "→ GET /api/players?season=${SEASON}"
          HTTP_CODE=$(curl -s -o /tmp/players.json -w "%{http_code}" \
            --max-time 240 \
            "${API_URL}/api/players?season=${SEASON}")
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::/api/players returned HTTP ${HTTP_CODE}"
            cat /tmp/players.json | head -20 || true
            exit 1
          fi
          python3 -c "import json; d=json.load(open('/tmp/players.json')); print(f\"✓ {d['games_included']} games · {len(d['batters'])} batters · {len(d['pitchers'])} pitchers · last {d.get('last_game_date')}\")"
