# Build Vite frontend and deploy to GitHub Pages (project site:
# https://<owner>.github.io/<repo>/).
#
# One-time repo setup:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Secrets (Settings → Secrets → Actions):
#   VITE_API_URL — same as your Fly API root, e.g. https://my-app.fly.dev (no trailing slash)
#
# Fly: fly secrets set CORS_ORIGINS="https://<user>.github.io" (origin has no path)
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Project Pages base path must match the repo name
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          if [ -z "${VITE_API_URL}" ]; then
            echo "::error::Set repository secret VITE_API_URL to your API base (e.g. https://my-app.fly.dev)"
            exit 1
          fi
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
