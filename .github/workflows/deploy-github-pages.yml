# Deploy the Vite app in frontend/ to GitHub Pages (NOT the repo README).
#
# REQUIRED repo setting (otherwise GitHub serves repo root → README.md):
#   Settings → Pages → Build and deployment → Source = "GitHub Actions"
#   If you see "Deploy from a branch", switch to GitHub Actions and save.
#
# Secrets: set VITE_API_URL and/or use existing API_BASE_URL (same Fly URL).
#
# Fly CORS: include https://<user>.github.io
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          SECRET_VITE: ${{ secrets.VITE_API_URL }}
          SECRET_API: ${{ secrets.API_BASE_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          if [ -n "${SECRET_VITE}" ]; then
            export VITE_API_URL="${SECRET_VITE}"
          elif [ -n "${SECRET_API}" ]; then
            export VITE_API_URL="${SECRET_API}"
            echo "Using API_BASE_URL as VITE_API_URL for build."
          else
            echo "::error::Set repository secret VITE_API_URL or API_BASE_URL (your Fly API root, e.g. https://my-app.fly.dev)"
            exit 1
          fi
          npm ci
          npm run build
          test -f dist/index.html || { echo "::error::Build did not produce dist/index.html"; exit 1; }
          test -s dist/index.html || { echo "::error::dist/index.html is empty"; exit 1; }
          echo "Built site (first lines of index.html):"
          head -n 5 dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
