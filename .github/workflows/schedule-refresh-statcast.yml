# Daily: fetch incremental Statcast data from Savant + pre-compute weekly caches.
#
# Secrets: API_BASE_URL (required), ADMIN_API_KEY (required if your API sets ADMIN_API_KEY).
# Runs after schedule-refresh-actuals (~30 min later to avoid overlap).
# Test: Actions → this workflow → Run workflow.
name: Schedule — refresh statcast

on:
  schedule:
    # 10:30 UTC daily (~5:30 AM EST), 30 min after refresh-actuals
    - cron: "30 10 * * *"
  workflow_dispatch:

jobs:
  refresh-statcast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate configuration
        env:
          BASE: ${{ secrets.API_BASE_URL }}
          KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import os
          from urllib.parse import urlparse

          raw_base = os.environ.get("BASE", "")
          raw_key = os.environ.get("KEY", "")

          if not raw_base:
              print("::error::Secret API_BASE_URL is not set.")
              raise SystemExit(1)

          base = raw_base.strip().strip('"').strip("'").rstrip("/")
          parsed = urlparse(base)
          if parsed.scheme not in ("http", "https") or not parsed.netloc:
              print(f"::error::API_BASE_URL is not a valid URL: {base!r}")
              raise SystemExit(1)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"API_URL={base}\n")
              if raw_key:
                  f.write(f"ADMIN_KEY={raw_key.strip()}\n")

          print(f"✓ API_URL = {base}")
          PY

      - name: Refresh Statcast + warm weekly cache
        run: |
          set -euo pipefail
          HEADER=""
          if [ -n "${ADMIN_KEY:-}" ]; then
            HEADER="-H X-Admin-Key:${ADMIN_KEY}"
          fi

          echo "→ POST /api/admin/refresh-statcast?season=2026"
          HTTP_CODE=$(curl -s -o /tmp/statcast_response.json -w "%{http_code}" \
            --max-time 900 \
            -X POST \
            ${HEADER} \
            "${API_URL}/api/admin/refresh-statcast?season=2026")

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/statcast_response.json | python3 -m json.tool 2>/dev/null || cat /tmp/statcast_response.json

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::refresh-statcast failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "✓ Statcast refresh complete"
