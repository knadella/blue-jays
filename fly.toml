# Fly.io — https://fly.io/docs/launch/
#
# First deploy: create the app once (names are global on Fly), then deploy:
#   fly apps create <app> --org personal
#   fly deploy
# If the name is taken, pick another and set `app` below to match.

app = "mlb-forecast-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_CACHE_DIR = "/data"
  STATCAST_CACHE_DIR = "/data/statcast_frames"
  WEEKLY_CACHE_DIR = "/data/weekly_cache"
  STATCAST_LOCAL_DIR = "/data/statcast_local"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    idle_timeout = 60

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  # shared-cpu-1x / 1GB: plenty for serving cached JSON to a handful of users.
  # Always-on (min_machines_running=1) avoids cold starts. 1GB headroom keeps
  # pandas-based WPA/Statcast cache rebuilds from OOMing (512MB risks it).
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1

[mounts]
  source = "mlb_cache"
  destination = "/data"
  initial_size = "3gb"
