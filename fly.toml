# Fly.io — https://fly.io/docs/launch/
# Replace `app` with your app name after `fly apps create` or `fly launch`.

app = "mlb-forecast-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  POSTERIOR_CACHE_DIR = "/data/posteriors"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    idle_timeout = 900

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "2gb"
  cpus = 2

[mounts]
  source = "mlb_cache"
  destination = "/data"
  initial_size = "3gb"
