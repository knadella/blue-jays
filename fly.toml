# Fly.io — https://fly.io/docs/launch/
#
# First deploy: create the app once (names are global on Fly), then deploy:
#   fly apps create <app> --org personal
#   fly deploy
# If the name is taken, pick another and set `app` below to match.

app = "mlb-forecast-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  POSTERIOR_CACHE_DIR = "/data/posteriors"
  STATCAST_CACHE_DIR = "/data/statcast_frames"
  WEEKLY_CACHE_DIR = "/data/weekly_cache"
  STATCAST_LOCAL_DIR = "/data/statcast_local"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    # Fly caps this at 900s; longer refits need a different pattern (e.g. SSH/cron on the machine).
    idle_timeout = 900

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "2gb"
  cpus = 2

[mounts]
  source = "mlb_cache"
  destination = "/data"
  initial_size = "3gb"
